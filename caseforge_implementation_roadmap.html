      </div>
      <div class="rm-card" style="margin-bottom:0">
        <div class="rm-lbl"><i class="ti ti-components" style="font-size:13px;vertical-align:-1px;margin-right:4px" aria-hidden="true"></i>Components to build</div>
        <div style="display:flex;flex-wrap:wrap;gap:5px">${p.components.map(c=>`<span style="background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:3px 8px;font-size:11px;color:var(--color-text-secondary);font-family:var(--font-mono)">${c}</span>`).join('')}</div>
      </div>
    </div>

    ${p.ai?`<div class="rm-card" style="border-left:2px solid var(--color-border-warning);border-radius:0 var(--border-radius-lg) var(--border-radius-lg) 0"><div class="rm-lbl" style="color:var(--color-text-warning)"><i class="ti ti-sparkles" style="font-size:13px;vertical-align:-1px;margin-right:4px" aria-hidden="true"></i>AI integration</div><div style="font-size:12px;color:var(--color-text-secondary);line-height:1.7">${p.ai}</div></div>`:''}

    <div class="rm-g2">
      <div class="rm-card" style="margin-bottom:0;background:var(--color-background-secondary)">
        <div class="rm-lbl"><i class="ti ti-arrow-right" style="font-size:13px;vertical-align:-1px;margin-right:4px" aria-hidden="true"></i>Dependency</div>
        <div style="font-size:13px;font-weight:500;color:var(--color-text-primary)">${p.dep}</div>
      </div>
      <div class="rm-card" style="margin-bottom:0;border-left:2px solid ${p.dot};border-radius:0 var(--border-radius-lg) var(--border-radius-lg) 0">
        <div class="rm-lbl"><i class="ti ti-bulb" style="font-size:13px;vertical-align:-1px;margin-right:4px" aria-hidden="true"></i>Implementation note</div>
        <div style="font-size:12px;color:var(--color-text-secondary);line-height:1.6">${p.note}</div>
      </div>
    </div>`;

  document.getElementById('stk').innerHTML=STACK.map(s=>`
    <div class="rm-card" style="margin-bottom:0">
      <div style="display:flex;align-items:center;gap:7px;margin-bottom:10px">
        <div style="width:28px;height:28px;border-radius:var(--border-radius-md);background:${s.bg};border:0.5px solid ${s.brd};display:flex;align-items:center;justify-content:center">
          <i class="${s.icon}" style="font-size:15px;color:${s.col}" aria-hidden="true"></i>
        </div>
        <div style="font-size:12px;font-weight:500;color:var(--color-text-primary)">${s.label}</div>
      </div>
      ${s.items.map(i=>`<div style="font-size:11px;color:var(--color-text-secondary);padding:4px 0;border-bottom:0.5px solid var(--color-border-tertiary);line-height:1.5">${i}</div>`).join('')}
    </div>`).join('');
}

function go(id){cur=id;draw();}
draw();
</script>
