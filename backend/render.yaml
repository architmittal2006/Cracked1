services:
  - type: web
    name: cracked-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run migrate && npm run start
    envVars:
      - key: DATABASE_URL
        sync: false # Set in Render dashboard using your Neon PostgreSQL connection string
      - key: SESSION_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false # Set to your Vercel deployment URL (e.g., https://your-project.vercel.app)
      - key: BASE_URL
        sync: false # Matching CLIENT_ORIGIN
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
