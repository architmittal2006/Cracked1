name: AI Development Orchestrator

# Bootstrap entrypoint. The workflow file must live on the default branch for
# workflow_dispatch to work (GitHub docs: "This event will only trigger a
# workflow run if the workflow file exists on the default branch"), but the
# orchestrator code and all run state live on the hardcoded trusted branch
# `automation/gpt-devin-orchestrator` — this workflow checks that branch out
# and pushes state commits there, never to main or any other branch.
# The ref is NOT a workflow_dispatch input: user-supplied refs could point at
# untrusted code that would run with API credentials.
#
# Required secrets: GROQ_API_KEY (default provider, free tier) or
# OPENAI_API_KEY (only when LLM_PROVIDER=openai), plus DEVIN_API_KEY and
# DEVIN_ORG_ID (secret or var).
# Permissions: contents: write (state commits on orchestrator_ref only),
#              pull-requests: read (PR diff evidence for the reviewer).
# The workflow never merges PRs and never deploys.

on:
  workflow_dispatch:
    inputs:
      task_description:
        description: 'Development task for Devin to implement'
        required: true
        type: string
      acceptance_criteria:
        description: 'Acceptance criteria (one per line)'
        required: true
        type: string
      repository:
        description: 'GitHub repository Devin should work in'
        required: false
        default: 'architmittal2006/Cracked1'
        type: string
      base_branch:
        description: 'Branch the task targets / brief references'
        required: false
        default: 'feature/phase-2-admin-cms'
        type: string
      llm_provider:
        description: 'LLM provider (groq = free tier default, openai = paid)'
        required: false
        default: 'groq'
        type: choice
        options: [groq, openai]
      groq_model:
        description: 'Groq model (used when llm_provider=groq)'
        required: false
        default: 'openai/gpt-oss-120b'
        type: string
      openai_model:
        description: 'OpenAI model (used when llm_provider=openai)'
        required: false
        default: 'gpt-5-mini'
        type: string
      devin_mode:
        description: 'Devin agent mode'
        required: false
        default: 'normal'
        type: choice
        options: [normal, fast, lite, ultra, fusion]
      devin_max_acu_limit:
        description: 'Hard ACU cap for the Devin session (spending control)'
        required: false
        default: '10'
        type: string
      max_poll_minutes:
        description: 'Per-round Devin polling timeout'
        required: false
        default: '90'
        type: string
      max_openai_calls:
        description: 'OpenAI API call budget'
        required: false
        default: '12'
        type: string
      max_correction_cycles:
        description: 'GPT->Devin correction cycles (max 2)'
        required: false
        default: '2'
        type: string

permissions:
  contents: write # state commits are pushed to orchestrator_ref, not main
  pull-requests: read # fetch PR diffs so GPT reviews real code

concurrency:
  group: ai-orchestrator
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      # Hardcoded trusted branch — deliberately not a workflow input.
      ORCHESTRATOR_REF: automation/gpt-devin-orchestrator
      TASK_DESCRIPTION: ${{ inputs.task_description }}
      TASK_ACCEPTANCE_CRITERIA: ${{ inputs.acceptance_criteria }}
      TASK_REPOSITORY: ${{ inputs.repository }}
      TASK_BASE_BRANCH: ${{ inputs.base_branch }}
      LLM_PROVIDER: ${{ inputs.llm_provider }}
      GROQ_MODEL: ${{ inputs.groq_model }}
      OPENAI_MODEL: ${{ inputs.openai_model }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DEVIN_MODE: ${{ inputs.devin_mode }}
      DEVIN_MAX_ACU_LIMIT: ${{ inputs.devin_max_acu_limit }}
      ORCHESTRATOR_MAX_POLL_MINUTES: ${{ inputs.max_poll_minutes }}
      ORCHESTRATOR_MAX_OPENAI_CALLS: ${{ inputs.max_openai_calls }}
      ORCHESTRATOR_MAX_CORRECTION_CYCLES: ${{ inputs.max_correction_cycles }}
      ORCHESTRATOR_STATE_PATH: orchestrator-state.json
      ORCHESTRATOR_REPORT_DIR: orchestrator-reports
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
      DEVIN_ORG_ID: ${{ secrets.DEVIN_ORG_ID || vars.DEVIN_ORG_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout orchestrator branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: automation/gpt-devin-orchestrator
          fetch-depth: 0

      - name: Verify trusted orchestrator ref
        # Fail fast before any checked-out code runs: the ref must be exactly
        # the trusted automation branch — never main/master/production or any
        # user-supplied value.
        run: |
          set -euo pipefail
          case "$ORCHESTRATOR_REF" in
            automation/gpt-devin-orchestrator) ;;
            *) echo "::error::Untrusted orchestrator ref: $ORCHESTRATOR_REF"; exit 1 ;;
          esac
          case "$ORCHESTRATOR_REF" in
            main|master|production|prod|release*) echo "::error::Protected branch refused: $ORCHESTRATOR_REF"; exit 1 ;;
          esac
          git fetch --depth=1 origin "$ORCHESTRATOR_REF"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" || {
            echo "::error::Checked-out HEAD does not match origin/$ORCHESTRATOR_REF"; exit 1; }
          echo "Verified orchestrator ref: $ORCHESTRATOR_REF @ $(git rev-parse --short HEAD)"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Validate configuration
        run: |
          test -n "$DEVIN_API_KEY" || { echo "::error::DEVIN_API_KEY secret is not set"; exit 1; }
          test -n "$DEVIN_ORG_ID" || { echo "::error::DEVIN_ORG_ID secret/variable is not set"; exit 1; }
          if [ "$LLM_PROVIDER" = "groq" ]; then
            test -n "$GROQ_API_KEY" || { echo "::error::GROQ_API_KEY secret is not set (llm_provider=groq)"; exit 1; }
          else
            test -n "$OPENAI_API_KEY" || { echo "::error::OPENAI_API_KEY secret is not set (llm_provider=openai)"; exit 1; }
          fi
          test -f orchestrator/src/cli.mjs || { echo "::error::orchestrator code missing on $ORCHESTRATOR_REF"; exit 1; }
          node -e "const c=Number(process.env.ORCHESTRATOR_MAX_CORRECTION_CYCLES); if(c>2){console.error('max_correction_cycles cannot exceed 2');process.exit(1)}"

      - name: Run orchestrator tests (mocked, no API credits)
        working-directory: orchestrator
        run: npm test

      - name: Restore latest orchestrator state
        run: |
          git fetch --depth=1 origin "$ORCHESTRATOR_REF" || true
          git checkout "origin/$ORCHESTRATOR_REF" -- orchestrator-state.json 2>/dev/null || true
          if [ -f orchestrator-state.json ]; then
            echo "Resuming from committed state: $(node -e "console.log(JSON.parse(require('fs').readFileSync('orchestrator-state.json','utf8')).devinSessionId||'no session yet')")"
          else
            echo "No prior state found; starting fresh."
          fi

      - name: Run orchestrator
        id: orchestrator
        run: node orchestrator/src/cli.mjs

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orchestrator-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: orchestrator-reports/
          if-no-files-found: warn

      - name: Upload state snapshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orchestrator-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: orchestrator-state.json
          if-no-files-found: warn

      - name: Persist state to orchestrator branch
        if: always()
        run: |
          # Push target is a literal — state can never land on main or any
          # other branch even if ORCHESTRATOR_REF were somehow altered.
          test "$ORCHESTRATOR_REF" = "automation/gpt-devin-orchestrator" || {
            echo "::error::Refusing to persist state to untrusted ref: $ORCHESTRATOR_REF"; exit 1; }
          if [ -f orchestrator-state.json ]; then
            mkdir -p .orchestrator-state
            cp orchestrator-state.json ".orchestrator-state/state-${{ github.run_id }}-${{ github.run_attempt }}.json"
            cp orchestrator-state.json .orchestrator-state/latest.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .orchestrator-state/ orchestrator-state.json || true
            if ! git diff --cached --quiet; then
              git commit -m "chore: persist orchestrator state for run ${{ github.run_id }} (attempt ${{ github.run_attempt }})"
              git push origin "HEAD:refs/heads/automation/gpt-devin-orchestrator"
            fi
          fi
